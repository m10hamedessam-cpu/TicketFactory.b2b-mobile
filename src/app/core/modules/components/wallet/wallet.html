<div class="container">
  <div class="wallet-page">
    <app-page-header title="Wallet" subtitle="Manage company funds and agent balances." />

    <div class="total-card">
      <div class="wallet-card-header">
        <h2>COMPANY WALLET · MAIN ACCOUNT</h2>
        <p>TicketFactory KSA · SAR Account</p>
      </div>

      <div class="wallet-balance">
        <span>SAR</span>
        <h2>487,720.50</h2>
      </div>

      <p class="wallet-update">2 min ago · Last update</p>

      <button type="button" class="top-up-button" routerLink="/top-up-request">
        <i class="pi pi-wallet" aria-hidden="true"></i>
        <span>Top-Up Request</span>
      </button>

      <div class="wallet-actions">
        <button type="button" class="wallet-action-button" routerLink="/wallet-history">
          <i class="pi pi-history" aria-hidden="true"></i>
          <span>Wallet History</span>
        </button>

        <button type="button" class="wallet-action-button" routerLink="/request-status">
          <i class="pi pi-file" aria-hidden="true"></i>
          <span>Request Status</span>
        </button>
      </div>
    </div>

    <div class="bookings-history">
      <h2 class="section-title">Bookings History</h2>
      <p class="section-subtitle">
        Transfer to our bank account, send the receipt to support, and the accountants will credit
        it manually.
      </p>

      @for (account of accounts; track account.id) {
        <app-bank-account-card [account]="account" />
      }
    </div>
  </div>
</div>
